<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}EBT System{% endblock %} | Employee Break Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
<div class="login-wrapper">
  <div class="login-split">
    <!-- Left illustration panel -->
    <div class="login-panel-left">
      <div class="login-panel-logo">
        <span class="login-panel-logo-icon">&#128107;</span>
        <div>
          <span class="login-panel-logo-name">Employee Break Tracking &amp;<br>Availability Prediction System</span>
          <span class="login-panel-logo-sub">Smarter Work. Better Tomorrow.</span>
        </div>
      </div>
      <div class="login-panel-illustration">
        <img src="{{ url_for('static', filename='images/office-meeting.png') }}"
             alt="Office meeting illustration"
             class="login-illustration-img"/>
      </div>
    </div>
    <!-- Right login card -->
    <div class="login-panel-right">
      <div class="login-box">
        {% block auth_content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
