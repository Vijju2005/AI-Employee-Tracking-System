{% extends "base_auth.html" %}
{% block title %}Set New Password{% endblock %}

{% block auth_content %}
<div style="text-align:center;margin-bottom:1.5rem;">
  <div style="width:48px;height:48px;border-radius:12px;background:var(--blue-light);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.75rem;">
    <i data-lucide="lock-keyhole" style="width:24px;height:24px;"></i>
  </div>
  <h2 style="font-size:1.3rem;font-weight:800;color:var(--navy);margin:0;letter-spacing:-0.02em;">Set New Password</h2>
  <p style="font-size:0.84rem;color:var(--text-sec);margin:0.35rem 0 0;">
    Create a strong password with at least 8 characters.
  </p>
</div>

{% if error %}
<div class="alert alert-danger" style="margin-bottom:1.25rem;">
  <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;"></i>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" data-loading>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <div class="form-group">
    <label class="form-label" for="new_password">
      <i data-lucide="lock"></i>
      <span>New Password</span>
    </label>
    <div style="position:relative;">
      <input type="password" id="new_password" name="password" class="form-control"
             placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"
             style="padding-right:2.75rem;"/>
      <button type="button" onclick="togglePass('new_password', 'eye1')" title="Toggle visibility"
              style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;">
        <i data-lucide="eye" id="eye1" style="width:18px;height:18px;"></i>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="confirm_password">
      <i data-lucide="check-circle"></i>
      <span>Confirm New Password</span>
    </label>
    <div style="position:relative;">
      <input type="password" id="confirm_password" name="confirm_password" class="form-control"
             placeholder="Re-enter password" required minlength="8" autocomplete="new-password"
             style="padding-right:2.75rem;"/>
      <button type="button" onclick="togglePass('confirm_password', 'eye2')" title="Toggle visibility"
              style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;">
        <i data-lucide="eye" id="eye2" style="width:18px;height:18px;"></i>
      </button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100 btn-lg">
    <span>Update Password</span>
    <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
  </button>
</form>

<div style="text-align:center;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border);">
  <a href="{{ url_for('auth.login') }}" style="font-size:0.82rem;color:var(--blue);font-weight:600;">
    Back to Sign In
  </a>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePass(inputId, eyeId) {
  const inp = document.getElementById(inputId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
