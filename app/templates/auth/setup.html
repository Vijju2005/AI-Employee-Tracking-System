{% extends "base_auth.html" %}
{% block title %}System Initialization{% endblock %}

{% block auth_content %}
<div style="text-align:center;margin-bottom:1.5rem;">
  <div style="width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.85rem;box-shadow:var(--shadow-md);">
    <i data-lucide="shield-check" style="width:28px;height:28px;"></i>
  </div>
  <h2 style="font-size:1.35rem;font-weight:800;color:var(--navy);margin:0;letter-spacing:-0.02em;">Primary Admin Setup</h2>
  <p style="font-size:0.84rem;color:var(--text-sec);margin:0.35rem 0 0;">Provision the root enterprise administrator account</p>
</div>

{% if error %}
<div class="alert alert-danger" style="margin-bottom:1.25rem;">
  <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;"></i>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="POST" action="{{ url_for('auth.setup') }}" data-loading>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <div class="form-group">
    <label class="form-label" for="username">
      <i data-lucide="user"></i>
      <span>Admin Username</span> <span class="req">*</span>
    </label>
    <input type="text" id="username" name="username" class="form-control"
           placeholder="e.g. admin" required autocomplete="username"/>
  </div>

  <div class="form-group">
    <label class="form-label" for="email">
      <i data-lucide="mail"></i>
      <span>Official Email</span> <span class="req">*</span>
    </label>
    <input type="email" id="email" name="email" class="form-control"
           placeholder="admin@company.com" required/>
  </div>

  <div class="form-group">
    <label class="form-label" for="password">
      <i data-lucide="lock"></i>
      <span>Master Password</span> <span class="req">*</span>
    </label>
    <input type="password" id="password" name="password" class="form-control"
           placeholder="Minimum 8 characters" required/>
  </div>

  <div class="form-group">
    <label class="form-label" for="confirm_password">
      <i data-lucide="lock"></i>
      <span>Confirm Password</span> <span class="req">*</span>
    </label>
    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
           placeholder="Repeat password" required/>
  </div>

  <button type="submit" class="btn btn-primary w-100 btn-lg" style="margin-top:0.75rem;">
    <i data-lucide="shield-check"></i>
    <span>Initialize Platform Admin</span>
  </button>
</form>
{% endblock %}
