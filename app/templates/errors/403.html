{% extends "base_auth.html" %}
{% block title %}Access Denied (403){% endblock %}

{% block auth_content %}
<div style="text-align:center;padding:2rem 1rem;">
  <div style="width:68px;height:68px;border-radius:18px;background:#FEF2F2;color:#DC2626;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.25rem;box-shadow:var(--shadow-sm);">
    <i data-lucide="shield-alert" style="width:36px;height:36px;"></i>
  </div>
  <h2 style="font-size:1.35rem;font-weight:800;color:var(--navy);margin:0;letter-spacing:-0.02em;">403 &mdash; Access Forbidden</h2>
  <p style="font-size:0.86rem;color:var(--text-sec);margin:0.5rem 0 1.5rem;line-height:1.5;">
    You do not possess the required administrative privileges to view this resource.
  </p>
  <div style="display:flex;justify-content:center;gap:0.75rem;">
    <a href="/" class="btn btn-primary btn-lg">
      <i data-lucide="home"></i>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
