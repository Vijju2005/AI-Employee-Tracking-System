services:
  - type: web
    name: ai-employee-tracking-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    disk:
      name: ebt-uploads-disk
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: APP_NAME
        value: EBT System
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PERSISTENT_UPLOAD_DIR
        value: /var/data/uploads
      - key: AUTO_SEED_DEMO
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: WTF_CSRF_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_SUPPRESS_SEND
        value: "true"
