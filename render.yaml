services:
  - type: web
    name: ebt-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: APP_NAME
        value: EBT System
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: WTF_CSRF_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_SUPPRESS_SEND
        value: "true"
